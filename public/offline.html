<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão · EcoCrédito Recife</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7faf2; color: #23310d; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 26rem; padding: 1.5rem; text-align: center; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { color: #5b6a48; line-height: 1.5; }
      button { margin-top: 1rem; min-height: 3rem; padding: 0 1.5rem; border: 0; border-radius: .75rem; background: #94c044; color: #23310d; font-size: 1rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Você está sem conexão</h1>
      <p>Não conseguimos falar com o servidor. Verifique sua internet e tente de novo.</p>
      <p>
        Se você enviou uma ocorrência e ela ficou guardada no aparelho, fique tranquilo: ela é enviada sozinha assim
        que a conexão voltar.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
