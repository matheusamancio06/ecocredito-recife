name: Keep alive

# O Supabase gratuito pausa o banco depois de uma semana sem uso.
# Uma consulta por dia mantém o protótipo no ar para as demonstrações.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta /api/saude
        run: |
          curl --fail --silent --show-error --max-time 60 https://ecocredito-recife.vercel.app/api/saude
